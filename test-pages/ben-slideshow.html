<!DOCTYPE html>
<!--
  BENIGN variant (AC-11): a blob-hosted slideshow that legitimately goes FULL SCREEN
  and handles Esc / arrow keys itself. Same "trap" APIs as the bonus attack, neutral
  content.
  Expected: untouched (including after "Start presentation" is clicked).
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Slides</title>
<style>body { font-family: Arial, sans-serif; margin: 40px; } button { padding: 8px 16px; font-size: 14px; }</style>
</head>
<body>
  <h1>Slides</h1>
  <button id="open">Open Q3 review deck</button>
<script>
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Q3 business review</title>
<style>
  html, body { margin:0; height:100%; font-family: Arial, sans-serif; }
  .slide { height:100%; display:grid; place-items:center; text-align:center; background:#f6f7fb; }
  #start { position:fixed; top:12px; right:12px; padding:8px 14px; }
</style></head>
<body>
  <button id="start">Start presentation</button>
  <div class="slide"><div><h1 id="title">Q3 business review</h1><p id="body">Slide 1 of 3 — revenue grew 12% quarter over quarter.</p></div></div>
  <script>
    const slides = [
      ['Q3 business review', 'Slide 1 of 3 — revenue grew 12% quarter over quarter.'],
      ['Customers', 'Slide 2 of 3 — 1,240 new customers, churn down to 2.1%.'],
      ['Next steps', 'Slide 3 of 3 — expand to two new regions in Q4.'],
    ];
    let i = 0;
    const show = () => { document.getElementById('title').textContent = slides[i][0]; document.getElementById('body').textContent = slides[i][1]; };
    document.getElementById('start').addEventListener('click', () => document.documentElement.requestFullscreen());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); i = Math.min(i + 1, slides.length - 1); show(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); i = Math.max(i - 1, 0); show(); }
      if (e.key === 'Escape' && document.fullscreenElement) { e.preventDefault(); document.exitFullscreen(); }
    });
  <\/script>
</body></html>`;
  document.getElementById('open').addEventListener('click', () => {
    window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
  });
</script>
</body>
</html>
