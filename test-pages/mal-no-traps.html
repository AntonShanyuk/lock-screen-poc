<!DOCTYPE html>
<!--
  MALICIOUS variant: a blatant lock screen with NO trapping code at all, that opens
  itself (script redirect during page load, no user click). Covered by the
  "blatant-auto-open" rule: very strong lock-screen content + self-opened.
  Expected: blocked.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Loading…</title></head>
<body>
<script>
  const html = `<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Windows Security Alert</title>
<style>body { margin:0; height:100vh; display:grid; place-items:center; background:#002bff; color:#fff; font-family:Arial, sans-serif; text-align:center; }</style>
</head><body>
  <div>
    <h1>Your computer has been locked</h1>
    <p>Virus infection detected: your IP address and passwords may be stolen. Do not restart your computer.</p>
    <p>Call Microsoft Support now: <b>1-800-555-0199</b></p>
    <p>Error code: 0x800704cf</p>
  </div>
</body></html>`;
  location.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
</script>
</body>
</html>
