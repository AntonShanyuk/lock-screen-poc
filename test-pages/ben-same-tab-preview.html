<!DOCTYPE html>
<!--
  BENIGN variant (AC-11): a generated report previewed in the SAME tab
  (location.href = blob) after a click. Same navigation primitive as the attack.
  Expected: untouched.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Export center</title>
<style>body { font-family: Arial, sans-serif; margin: 40px; } button { padding: 8px 16px; font-size: 14px; }</style>
</head>
<body>
  <h1>Export center</h1>
  <button id="preview">Preview quarterly export</button>
<script>
  document.getElementById('preview').addEventListener('click', () => {
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Quarterly export</title></head>
      <body style="font-family:Arial, sans-serif; margin:40px">
        <h1>Quarterly export</h1>
        <p>Generated ${new Date().toDateString()}</p>
        <table border="1" cellpadding="8">
          <tr><th>Region</th><th>Orders</th><th>Revenue</th></tr>
          <tr><td>North</td><td>412</td><td>$51,200</td></tr>
          <tr><td>South</td><td>388</td><td>$47,950</td></tr>
        </table>
      </body></html>`;
    location.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  });
</script>
</body>
</html>
