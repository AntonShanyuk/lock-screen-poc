<!DOCTYPE html>
<!--
  MALICIOUS variant, BONUS trapping layer (AC-15): floods the session history with
  pushState() so the Back button cannot leave, and blocks right-click. Opened by a
  user click (does not look self-opened) and has no keyboard blocking, so the
  history flood is what pushes it over the threshold.
  Expected: blocked; the verdict lists "history-flood".
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Download</title>
<style>body { font-family: Arial, sans-serif; margin: 40px; } button { padding: 10px 18px; font-size: 16px; }</style>
</head>
<body>
  <h1>Your download is ready</h1>
  <button id="continue">Continue</button>
<script>
  const html = `<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Security Warning</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#002bff; color:#fff; font-family:Arial, sans-serif; text-align:center; }
</style></head>
<body>
  <div>
    <h1>Windows has been locked</h1>
    <p>Suspicious activity was detected and your data may be compromised.</p>
    <p>Call Windows support toll-free: <b>(877) 555-0123</b></p>
  </div>
  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    for (let i = 0; i < 40; i++) history.pushState({ i }, '', '');
    window.addEventListener('popstate', () => history.pushState({}, '', ''));
  <\/script>
</body></html>`;
  document.getElementById('continue').addEventListener('click', () => {
    location.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  });
</script>
</body>
</html>
